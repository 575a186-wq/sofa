name: Weekly Niche Research

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check Chrome (required by trendspyg)
        run: google-chrome --version || chromium --version || echo "Chrome missing"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python src/pipeline.py
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: output/weekly_report.md
          if-no-files-found: error