# Candidate niche seeds for the POD niche research pipeline.
# Populated from the concept funnel (Table 4.4) - parametric "Type B" niches first.
# Weights for scoring live here so they can be calibrated after the first run.

scoring:
  trend_weight: 0.4
  social_weight: 0.0
  competition_weight: 0.3
  freshness_weight: 0.3
  trend_ref: 150.0
  competition_max_log10_listings: 6.0
  freshness_max_days: 365.0

niches:
  - id: coordinate-map-art
    name: "Coordinate / location map art"
    keywords: ["custom location map art", "coordinate map print", "personalized map poster"]
    art_type: parametric
    automation_fit: 1.0
    source_data: "lat/long or address -> map render"
    geo: US

  - id: star-map-art
    name: "Star map of the sky on a date"
    keywords: ["custom star map", "night sky star chart personalized", "birthday star map print"]
    art_type: parametric
    automation_fit: 1.0
    source_data: "date + location -> astronomy render"
    geo: US

  - id: audio-waveform-art
    name: "Audio waveform / sound wave art"
    keywords: ["sound wave art personalized", "voice wave print", "music waveform poster"]
    art_type: parametric
    automation_fit: 1.0
    source_data: "audio file -> waveform render"
    geo: US

  - id: natal-chart-art
    name: "Natal chart / zodiac birth chart"
